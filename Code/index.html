<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Pro Chat Viewer</title>
<link rel="stylesheet" herf="style.css">
</head>
<body>

<header>
WhatsApp Chat Viewer
</header>

<div class="topbar">
<input type="file" id="fileInput" accept=".txt">
<input type="text" id="search" placeholder="Search message">
<select id="filter">
<option value="all">All</option>
<option value="user">My Messages</option>
<option value="other">Other Messages</option>
</select>
<button onclick="toggleMode()">D/L</button>
<button onclick="goFirst()">1️⃣ First Msg</button>
</div>

<div class="stats" id="stats">Messages: 0</div>

<div class="chat" id="chat"></div>

<button class="scrollBtn" onclick="scrollBottom()">⬇</button>

<script src="funtion.js"> </script>

</body>
</html>
